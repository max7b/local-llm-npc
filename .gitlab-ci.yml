stages:
  - lint

lint:
  stage: lint
  image: python:3.14-slim
  rules:
    - if: $CI_MERGE_REQUEST_IID
  cache:
    - key:
        files:
          - poetry.lock
      paths:
        - .venv/
  before_script:
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install
  script:
    - poetry run ruff check .
    - poetry run ruff format --check .
    - poetry run pyright
    - poetry check --lock

commit-lint:
  stage: lint
  image: python:3.14-slim
  rules:
    - if: $CI_MERGE_REQUEST_IID
  script:
    - pip install gitlint
    - echo "$CI_MERGE_REQUEST_TITLE" | gitlint --msg-filename /dev/stdin

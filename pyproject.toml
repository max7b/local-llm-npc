[project]
name = "villager-test-bench"
version = "0.1.0"
description = ""
authors = [ { name = "Maxime Gatineau", email = "gatineau.mx@gmail.com" } ]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0"
dependencies = [
    "pydantic-settings>=2.0.0,<3.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [ { include = "app" } ]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.0"
pre-commit = "^4.1.0"
pyright = {version = "^1.1.408", extras = ["nodejs"]}
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
gitlint = "^0.19.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# include is required — without it pyright scans the entire workspace (including .venv)
include = ["app"]
exclude = ["app/notebooks", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
